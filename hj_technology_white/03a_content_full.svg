<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="4" fill="#0082FF"/>
  <!-- Title -->
  <text x="62" y="58" xml:space="preserve" font-family="'FZLanTingHeiS-M-GB', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="30" font-weight="bold" fill="#2E2E32">{{PAGE_TITLE}}</text>
  <!-- Title underline -->
  <rect x="62" y="70" width="48" height="3" rx="1.5" fill="#0082FF"/>
  <!-- Content area -->
  <text x="62" y="130" xml:space="preserve" font-family="'FZLanTingHeiS-R-GB', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="18" fill="#2E2E32">{{CONTENT_AREA}}</text>
  <!-- Logo -->
  <svg x="1052" y="20" width="203" height="38" viewBox="0 0 0.68612 1.00419" preserveAspectRatio="none">
    <image href="image6.png" x="0" y="0" width="1" height="1" preserveAspectRatio="none"/>
  </svg>
</svg>
